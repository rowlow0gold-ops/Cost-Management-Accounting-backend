name: Deploy Cost Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  IMAGE: stack-cost-backend:latest
  DEPLOYMENT: cost-backend
  NAMESPACE: apps
  KUBECONFIG: /tmp/k3s.yaml

jobs:
  deploy:
    name: Build & Deploy to K3s
    runs-on: [self-hosted, home]
    steps:
      - name: Sync source
        run: |
          cd /home/jj/apps/Cost-Management-Accounting-backend
          git fetch origin main
          git reset --hard origin/main

      - name: Build image
        run: |
          cd /home/jj/apps/Cost-Management-Accounting-backend
          docker build -t ${{ env.IMAGE }} .

      - name: Import into K3s containerd
        run: docker save ${{ env.IMAGE }} | /usr/local/bin/k3s ctr -n k8s.io images import -

      - name: Rollout restart deployment
        run: |
          /usr/local/bin/k3s kubectl --insecure-skip-tls-verify rollout restart deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }}
          /usr/local/bin/k3s kubectl --insecure-skip-tls-verify rollout status deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Health check
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://cost.minhojan-world.site/); [ "$code" -ge 200 ] && [ "$code" -lt 600 ] && echo "alive $code"
